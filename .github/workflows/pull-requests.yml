name: Test on MiniOJ

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  packages: read

concurrency:
  group: minioj-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  minioj:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@minioj-bot') &&
      github.event.repository.fork == false
    uses: FFFabulousRobotics/MiniOJ-images/.github/workflows/judge.yml@v1.0.1
    secrets:
      MINIOJ_CLIENT_ID: ${{ secrets.MINIOJ_CLIENT_ID }}
      MINIOJ_PRIVATE_KEY: ${{ secrets.MINIOJ_PRIVATE_KEY }}
